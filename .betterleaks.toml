[extend]
useDefault = true

[[allowlists]]
description = "Allow .secret files (local-only, never committed)"
paths = [
    "\\.secret$"
]

[[allowlists]]
description = "Generated files: build output, SvelteKit output, Paraglide cache"
paths = [
    '''(?:^|/)build/''',
    '''(?:^|/)\.svelte-kit/''',
    '''(?:^|/)project\.inlang/cache/''',
]

[[allowlists]]
description = "Throwaway credentials of the local deployment playground"
paths = [
    '''(?:^|/)deployment-playground/authelia/key\.pem$''',
    '''(?:^|/)deployment-playground/authelia/configuration\.yml$''',
]
regexes = [
    '''playground-admin-token-change-me-in-prod''',
]

[[allowlists]]
description = "Throwaway credentials of the local Authelia test environment"
paths = [
    '''(?:^|/)authelia-test-env/secrets/key\.pem$''',
    '''(?:^|/)authelia-test-env/configuration/configuration\.yml$''',
]

# Betterleaks reports generic secret rules that Gitleaks did not have. These
# values are local development placeholders, i18n labels and a package script,
# never real credentials. The regexes are anchored to avoid hiding a real
# secret that merely contains one of these words.
[[allowlists]]
description = "Local development placeholders and labels, not secrets"
regexes = [
    '''^(?:password|password123|admin123|postgres|node src/hash-password\.js|Forgot password\?|Change password|Mot de passe oublié \?|Changer le mot de passe)$''',
]
