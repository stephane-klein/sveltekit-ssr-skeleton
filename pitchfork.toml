#:schema https://pitchfork.jdx.dev/schema.json
namespace = "sveltekit-ssr-skeleton"

[settings.general]
mise = true

[daemons.postgres]
# Idiomatic pitchfork hack for Compose: foreground `compose up` risks being
# SIGKILLed at its 5s stop_timeout before containers stop; `-d` returns at once
# and `sleep infinity` keeps a PID to supervise, teardown goes through on_stop.
# https://pitchfork.jdx.dev/guides/lifecycle-hooks#compose-backed-daemons
run = "podman compose up -d && exec sleep infinity"
ready_cmd = "podman compose exec -T postgres pg_isready -U postgres"
auto = ["stop"]

[daemons.postgres.hooks]
on_stop = "mise x -- podman compose down"

[daemons.migrate]
run = "pnpm run migrate"
oneshot = true
depends = ["postgres"]

[daemons.seed]
run = "pnpm run seed"
oneshot = true
depends = ["migrate"]

[daemons.mailpit]
# Dev SMTP server + web UI from the mise-managed `mailpit` binary.
# $PORT0 = SMTP, $PORT1 = web UI; both bump together when occupied.
# The proxy routes to the web UI (`proxy_port`), SMTP is reached directly.
# Pitchfork rewrites the Host header to `localhost:$PORT` and passes the real
# one via X-Forwarded-Host, so Mailpit's same-origin CORS check fails. Allow
# every origin (loopback-only listener) with --api-cors '*'.
run = "exec mailpit --smtp 127.0.0.1:$PORT0 --listen 127.0.0.1:$PORT1 --api-cors '*'"
port = { expect = [1025, 8025], bump = true }
proxy_port = 8025
ready_cmd = "curl -fsS http://127.0.0.1:$PORT1/readyz"
auto = ["stop"]

[daemons.webapp]
run = "exec bash scripts/export-git-env.sh vite dev --port=$PORT"
stop_signal = { signal = "SIGTERM", timeout = "10s" }
depends = ["postgres", "seed", "mailpit"]
env = { SMTP_PORT = "{{ daemons.mailpit.ports[0] }}" }
auto = ["stop"]
port = { expect = [5173], bump = true }
ready_cmd = { run = "curl -fsS http://127.0.0.1:$PORT/-/ready", timeout = "5s" }
health_cmd = { run = "curl -fsS http://127.0.0.1:$PORT/-/healthy", interval = "200s", timeout = "5s", retries = 3 }
retry = 3

[daemons.authelia]
# Optional OIDC test stack: not a dependency of webapp. Start on demand with
# `pitchfork start authelia`. Same Compose hack as postgres (see note above).
dir = "authelia-test-env"
run = "podman compose up -d && exec sleep infinity"
ready_port = 9091
auto = ["stop"]

[daemons.authelia.hooks]
# Hooks run in the daemon's `dir` (authelia-test-env/), so no `cd` needed.
on_stop = "mise x -- podman compose down"
